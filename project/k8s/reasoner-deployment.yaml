apiVersion: apps/v1
kind: Deployment
metadata:
  name: reasoner-service
  namespace: workload-system
  labels:
    app: reasoner-service
    app.kubernetes.io/name: reasoner-service
    app.kubernetes.io/component: ai-reasoning-engine
    app.kubernetes.io/part-of: agentic-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reasoner-service
  template:
    metadata:
      labels:
        app: reasoner-service
        app.kubernetes.io/name: reasoner-service
    spec:
      containers:
        - name: reasoner
          image: reasoner-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8000"
            - name: LLM_PROVIDER
              value: "openai"
            - name: LLM_MODEL
              value: "gpt-4o-mini"
            - name: MCP_SERVER_URL
              value: "http://mcp-server.workload-system.svc.cluster.local:8001/mcp"
            - name: PGHOST
              value: "postgres"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "agentic_autoscalar_db"
            - name: PGUSER
              value: "agentic_autoscalar"
            - name: PGPASSWORD
              value: "agentic_autoscalar"
            - name: RAG_ENABLED
              value: "true"
            - name: HF_HOME
              value: "/app/.cache/huggingface"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reasoner-llm-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENAI_API_BASE
              valueFrom:
                secretKeyRef:
                  name: reasoner-llm-secret
                  key: OPENAI_API_BASE
                  optional: true
          ports:
            - name: http-reasoner
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1500Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-reasoner
            initialDelaySeconds: 60   # allow model weights to load
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-reasoner
            initialDelaySeconds: 30   # wait for sentence-transformer init
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
