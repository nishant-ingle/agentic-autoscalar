apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: workload-system
  labels:
    app: mcp-server
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: agentic-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
        app.kubernetes.io/name: mcp-server
    spec:
      serviceAccountName: mcp-server-sa
      containers:
        - name: mcp-server
          image: mcp-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_PORT
              value: "8001"
            - name: PROMETHEUS_URL
              value: "http://prometheus-server.monitoring.svc.cluster.local:80"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - name: http-mcp
              containerPort: 8001
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-mcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-mcp
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
