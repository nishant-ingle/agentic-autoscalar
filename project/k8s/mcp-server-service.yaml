apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: workload-system
  labels:
    app: mcp-server
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: agentic-autoscaler
spec:
  type: ClusterIP
  selector:
    app: mcp-server
  ports:
    - name: http-mcp
      port: 8001
      targetPort: 8001
      protocol: TCP
