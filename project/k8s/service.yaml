apiVersion: v1
kind: Service
metadata:
  name: target-workload
  namespace: workload-system
  labels:
    app: target-workload
    app.kubernetes.io/name: target-workload
    release: kube-prometheus-stack
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      protocol: TCP
  selector:
    app: target-workload
