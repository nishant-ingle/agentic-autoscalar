apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-workload
  namespace: workload-system
  labels:
    app.kubernetes.io/name: target-workload
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: agentic-autoscaler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: target-workload
  template:
    metadata:
      labels:
        app: target-workload
        app.kubernetes.io/name: target-workload
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: target-service
          image: target-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: GIN_MODE
              value: "release"
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-metrics
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
