apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-sa
  namespace: workload-system
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: agentic-autoscaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-reader
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: agentic-autoscaler
rules:
  # Strictly read-only permissions for telemetry and inspection
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "services", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-reader-binding
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: agentic-autoscaler
subjects:
  - kind: ServiceAccount
    name: mcp-server-sa
    namespace: workload-system
roleRef:
  kind: ClusterRole
  name: mcp-server-reader
  apiGroup: rbac.authorization.k8s.io
