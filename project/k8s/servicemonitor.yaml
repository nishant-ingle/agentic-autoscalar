apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: target-workload-monitor
  namespace: workload-system
  labels:
    app: target-workload
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: target-workload
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
