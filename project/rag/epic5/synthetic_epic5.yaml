# Synthetic SRE Runbooks & Post-Mortem Incident Knowledge Base
# Schema:
# - id: unique identifier string
#   title: clear incident or runbook title
#   scenario: operational scenario classification
#   content: full incident context, root causes, symptoms, and scaling remediations

incidents:
  - id: "INC-CPU-SPIKE-001"
    title: "Flash Traffic Surge Exhausting CPU and Thread Pool"
    scenario: "Sudden load spike on CPU-bound microservices"
    content: >
      Incident INC-CPU-SPIKE-001: Target service experienced sudden 4x traffic surge due to marketing campaign.
      CPU utilization spiked from 25% to 92%, causing request queuing, thread pool starvation, and p99 latency to rise above 1800ms.
      Root Cause: Native Kubernetes HPA reacted with a 60-second delay due to metrics scraping intervals.
      Remediation & Action: Proactively scale up replica count immediately by 2.5x (e.g. from 2 to 5 replicas).
      Cooldown Window: Maintain scaled replica count for minimum 5 minutes to prevent flapping before considering scale down.

  - id: "INC-MEM-LEAK-002"
    title: "Slow Heap Growth Leading to OOMKills During Moderate Load"
    scenario: "Memory accumulation and pod crash looping"
    content: >
      Incident INC-MEM-LEAK-002: Service pods encountered repeated OOMKilled events under persistent moderate traffic (300 RPS).
      Memory metrics showed linear climb exceeding 85% limit without subsequent garbage collection release.
      Root Cause: Cache retention bug preventing eviction of expired session payloads.
      Remediation & Action: Scaling horizontally does not fix memory leak permanently but temporarily relieves memory pressure.
      Recommended Action: Scale replicas from N to N+2 to distribute memory load while scheduling rolling restarts of aging pods.
      Constraint: Flag memory leak signature to prevent aggressive downscaling.

  - id: "INC-FLAP-OSC-003"
    title: "Aggressive Metric Oscillation and Rapid HPA Flapping"
    scenario: "Unstable scaling cycling between scale-up and scale-down"
    content: >
      Incident INC-FLAP-OSC-003: Target microservice entered a destructive flapping state, scaling between 2 and 10 replicas every 90 seconds.
      Symptom: Cold container startup overhead aggravated request latency; subsequent scale-down occurred before pods became ready.
      Root Cause: Insufficient hysteresis cooldown period configured on scale-down behavior.
      Remediation & Action: Enforce a strict hysteresis window. Reject scale-down recommendations within 10 minutes of any scale-up event.
      Stabilization: Keep replica target steady at median load recommendation until metrics plateau for at least 3 consecutive scrape cycles.

  - id: "INC-DEP-LATENCY-004"
    title: "Downstream Database Connection Exhaustion Causing Upstream Latency"
    scenario: "Slow downstream dependency mimicking CPU load"
    content: >
      Incident INC-DEP-LATENCY-004: HTTP response times elevated to 3200ms while CPU utilization remained under 30%.
      Naive autoscalers failed to trigger because CPU was low, while concurrent request count climbed drastically.
      Root Cause: Postgres connection pool reached 100% capacity due to slow unindexed analytical queries.
      Remediation & Action: Do not scale target replicas excessively, as more replicas will open additional connections and worsen DB lock contention.
      Recommended Action: Hold target replicas constant, activate rate-limiting guardrails, and trigger circuit breaker.

  - id: "INC-BATCH-BURST-005"
    title: "Periodic Scheduled Cron Batch Processing Ingestion Spike"
    scenario: "Predictable periodic telemetry burst"
    content: >
      Incident INC-BATCH-BURST-005: Every hour at minute :00, asynchronous worker queues experience an influx of 10,000 ingestion tasks.
      Latency temporarily spikes for 3 minutes before naturally returning to baseline without intervention.
      Root Cause: Synchronous hourly batch cron triggers.
      Remediation & Action: Moderate step scale-up (+1 to +2 replicas) 2 minutes before the top of the hour, rather than massive reactive scale-out.
      Post-incident note: Differentiate burst traffic from persistent traffic via telemetry rate-of-change derivatives.
