# Reasoning Engine Configuration
service:
  name: "agentic-autoscaler-reasoner"
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  timeout_seconds: 15.0

# LLM Provider Configuration
model_setting:
  provider: "openai"  # options: "openai", "groq", "gemini", "mock"
  temperature: 0.1
  max_retries: 2

providers:
  openai:
    model_name: "gpt-4o-mini"
  groq:
    model_name: "llama-3.3-70b-versatile"
  gemini:
    model_name: "gemini-1.5-flash"
  mock:
    model_name: "deterministic-heuristic"

# Default Scaling Evaluation Guardrail Margins
scaling_margins:
  target_cpu_percent: 65.0
  target_memory_percent: 75.0
  latency_spike_threshold_ms: 250.0
  error_rate_threshold_percent: 5.0
